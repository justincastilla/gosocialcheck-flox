{
  "lockfile-version": 1,
  "manifest": {
    "schema-version": "1.17.0",
    "install": {
      "gh": {
        "pkg-path": "gh"
      },
      "git": {
        "pkg-path": "git"
      },
      "go": {
        "pkg-path": "go_1_26"
      },
      "gopls": {
        "pkg-path": "gopls"
      },
      "iana-etc": {
        "pkg-path": "iana-etc"
      },
      "zizmor": {
        "pkg-path": "zizmor"
      }
    },
    "vars": {
      "GOTOOLCHAIN": "local"
    },
    "hook": {
      "on-activate": "  export GOPATH=\"$FLOX_ENV_CACHE/go\"\n  export GOBIN=\"$GOPATH/bin\"\n  mkdir -p \"$GOBIN\"\n\n  if [ -z \"${GITHUB_TOKEN:-}\" ] && [ -z \"${GH_TOKEN:-}\" ]; then\n    if token=\"$(gh auth token 2>/dev/null)\"; then\n      export GITHUB_TOKEN=\"$token\"\n    else\n      echo \"gosocialcheck: no GITHUB_TOKEN set and gh is not logged in;\" >&2\n      echo \"  'gosocialcheck update' may hit the GitHub API rate limit.\" >&2\n      echo \"  Run 'gh auth login' or export GITHUB_TOKEN.\" >&2\n    fi\n  fi\n"
    },
    "profile": {
      "common": "  export PATH=\"$GOBIN:$PATH\"\n"
    },
    "options": {
      "systems": [
        "aarch64-darwin",
        "aarch64-linux",
        "x86_64-darwin",
        "x86_64-linux"
      ]
    },
    "build": {
      "gosocialcheck": {
        "command": "  mkdir -p \"$out/bin\"\n  go build -trimpath \\\n    -ldflags \"-s -w -X github.com/AkihiroSuda/gosocialcheck/cmd/gosocialcheck/version.Version=$(git describe --tags --always --dirty)\" \\\n    -o \"$out/bin/gosocialcheck\" ./cmd/gosocialcheck\n",
        "runtime-packages": [
          "git",
          "iana-etc"
        ],
        "version": {
          "command": "git describe --tags --always --dirty"
        },
        "description": "Social reputation checker for Go modules",
        "license": [
          "Apache-2.0"
        ]
      }
    }
  },
